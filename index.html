<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おはじき</title>
<style>
:root{--bg:#fff8ec;--ink:#3b2a1a;--desk:#c9712f;--desk2:#b5601f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1e14;--ink:#fbeedd}}
:root[data-theme="dark"]{--bg:#2a1e14;--ink:#fbeedd}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo",sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;padding:8px;box-sizing:border-box;gap:8px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select{font:inherit;font-size:20px;border:2px solid var(--desk);background:transparent;color:var(--ink);border-radius:10px;padding:4px 14px}
button.go{background:var(--desk);color:#fff}
#board{position:relative;flex:1;min-height:300px;background:var(--desk);border-radius:16px;overflow:hidden;touch-action:none;user-select:none;box-shadow:inset 0 0 0 6px var(--desk2)}
.c{position:absolute;width:48px;height:48px;border-radius:50%;background:#2f8fe8;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 2px 3px rgba(0,0,0,.4);touch-action:none;cursor:grab}
.c::after{content:"";position:absolute;left:12px;top:12px;width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.6)}
.c.drag{transform:scale(1.15);z-index:999}
</style></head><body><div class="wrap">
<div class="bar"><span>おはじきの かず</span><select id="n"></select><button class="go" id="reset">ならべなおす</button></div>
<div id="board"></div>
</div>
<script>
const board=document.getElementById('board'),sel=document.getElementById('n');
for(let i=1;i<=50;i++)sel.add(new Option(i,i));sel.value=12;
function build(){
  board.querySelectorAll('.c').forEach(e=>e.remove());
  const w=board.clientWidth,h=board.clientHeight,n=+sel.value;
  const cols=Math.max(1,Math.floor((w-20)/56));
  for(let i=0;i<n;i++){
    const e=document.createElement('div');e.className='c';
    const r=Math.floor(i/cols),c=i%cols;
    e.style.left=(12+c*56)+'px';e.style.top=(h-60-r*56)+'px';
    board.appendChild(e);drag(e);
  }
}
function drag(e){
  let dx,dy;
  e.addEventListener('pointerdown',ev=>{
    e.setPointerCapture(ev.pointerId);e.classList.add('drag');
    const r=e.getBoundingClientRect();dx=ev.clientX-r.left;dy=ev.clientY-r.top;
    board.appendChild(e);
  });
  e.addEventListener('pointermove',ev=>{
    if(!e.classList.contains('drag'))return;
    const br=board.getBoundingClientRect();
    e.style.left=Math.max(0,Math.min(board.clientWidth-48,ev.clientX-br.left-dx))+'px';
    e.style.top=Math.max(0,Math.min(board.clientHeight-48,ev.clientY-br.top-dy))+'px';
  });
  const up=()=>e.classList.remove('drag');
  e.addEventListener('pointerup',up);e.addEventListener('pointercancel',up);
}
sel.onchange=build;document.getElementById('reset').onclick=build;
window.addEventListener('load',build);
</script></body></html>
